<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Pass | إدارة كلمات المرور الآمنة</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase Import -->
    <script type="module" src="firebase-config.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        :root {
            --primary: #8B5CF6;
            --primary-dark: #7C3AED;
            --primary-light: #F5F3FF;
            --secondary: #A78BFA;
            --dark: #1E1B2E;
            --gray: #6B7280;
            --light-gray: #E9E4F0;
            --white: #FFFFFF;
            --error: #EF4444;
            --error-light: #FEF2F2;
            --success: #10B981;
            --success-light: #ECFDF5;
            --warning: #F59E0B;
            --shadow: 0 20px 60px rgba(139, 92, 246, 0.2);
            --shadow-light: 0 10px 30px rgba(139, 92, 246, 0.15);
            --radius: 24px;
            --transition: all 0.3s ease;
        }

        body {
            background: linear-gradient(135deg, #0F0A1E 0%, #1A0A3A 50%, #0D1B3E 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid rgba(139, 92, 246, 0.2);
            backdrop-filter: blur(20px);
        }

        .header {
            background: linear-gradient(135deg, #7C3AED 0%, #8B5CF6 50%, #A855F7 100%);
            padding: 50px;
            text-align: center;
            color: var(--white);
            position: relative;
            overflow: hidden;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .logo-text h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .logo-text p {
            font-size: 16px;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
            background: rgba(15, 10, 30, 0.95);
        }

        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            color: #F87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            color: #34D399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .message.info {
            background: rgba(139, 92, 246, 0.1);
            color: #A78BFA;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .mode-indicator {
            background: rgba(139, 92, 246, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .mode-icon {
            width: 40px;
            height: 40px;
            background: rgba(139, 92, 246, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--secondary);
            font-size: 20px;
        }

        .mode-text h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #E9E4F0;
        }

        .mode-text p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
        }

        .mode-text strong {
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #E9E4F0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-container {
            position: relative;
        }

        .input-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(139, 92, 246, 0.6);
        }

        .form-input {
            width: 100%;
            padding: 15px 45px 15px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(139, 92, 246, 0.3);
            color: #F3F0FF;
            border-radius: 12px;
            font-size: 16px;
            transition: var(--transition);
            text-align: right;
            direction: rtl;
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            text-align: right;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
            background: rgba(139, 92, 246, 0.08);
        }

        .form-input.success {
            border-color: var(--success);
        }

        .form-input.error {
            border-color: var(--error);
        }

        .password-toggle {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: var(--transition);
        }

        .password-toggle:hover {
            color: var(--primary);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #7C3AED, #A855F7);
            color: var(--white);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.6);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: var(--white);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(139, 92, 246, 0.2);
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
        }

        .hidden {
            display: none !important;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }
            
            .header {
                padding: 40px 20px;
            }
            
            .content {
                padding: 30px 20px;
            }
            
            .logo-text h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <div class="header">
                <div class="logo">
                    <div class="logo-icon">
                        <i class="fas fa-shield-alt"></i>
                    </div>
                    <div class="logo-text">
                        <h1>Nova Pass</h1>
                        <p>Secure • Smart • Simple</p>
                    </div>
                </div>
            </div>
            
            <div class="content">
                <div id="message" class="message hidden"></div>
                
                <div id="modeInfo" class="mode-indicator hidden">
                    <div class="mode-icon">
                        <i id="modeIcon" class="fas fa-user-plus"></i>
                    </div>
                    <div class="mode-text">
                        <h3 id="modeTitle">تسجيل حساب جديد</h3>
                        <p id="modeDescription">أدخل بياناتك لإنشاء حساب جديد</p>
                    </div>
                </div>
                
                <form id="authForm">
                    <div class="form-group">
                        <label for="email" class="form-label">
                            <i class="fas fa-envelope"></i>
                            البريد الإلكتروني
                        </label>
                        <div class="input-container">
                            <input 
                                type="email" 
                                id="email" 
                                class="form-input" 
                                placeholder="example@domain.com" 
                                required
                                autocomplete="email"
                            >
                            <div class="input-icon">
                                <i class="fas fa-at"></i>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group hidden" id="nameGroup">
                        <label for="name" class="form-label">
                            <i class="fas fa-user"></i>
                            الاسم الكامل
                        </label>
                        <div class="input-container">
                            <input 
                                type="text" 
                                id="name" 
                                class="form-input" 
                                placeholder="أحمد محمد"
                                autocomplete="name"
                            >
                            <div class="input-icon">
                                <i class="fas fa-user-circle"></i>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="password" class="form-label">
                            <i class="fas fa-lock"></i>
                            كلمة المرور
                        </label>
                        <div class="input-container">
                            <input 
                                type="password" 
                                id="password" 
                                class="form-input" 
                                placeholder="كلمة مرور قوية" 
                                required
                                autocomplete="current-password"
                            >
                            <div class="input-icon">
                                <i class="fas fa-key"></i>
                            </div>
                            <button type="button" class="password-toggle" id="togglePassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <button type="submit" class="submit-btn" id="submitBtn">
                        <i class="fas fa-sign-in-alt"></i>
                        <span id="btnText">التحقق من البريد الإلكتروني</span>
                    </button>
                </form>
                
                <div class="footer">
                    <p>باستخدام Nova Pass، فإنك توافق على شروط الخدمة وسياسة الخصوصية</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { 
            auth, 
            db,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            fetchSignInMethodsForEmail,
            onAuthStateChanged,
            doc, 
            getDoc,
            setDoc,
            serverTimestamp
        } from './firebase-config.js';

        const emailInput = document.getElementById('email');
        const nameInput = document.getElementById('name');
        const nameGroup = document.getElementById('nameGroup');
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');
        const authForm = document.getElementById('authForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const messageDiv = document.getElementById('message');
        const modeInfo = document.getElementById('modeInfo');
        const modeIcon = document.getElementById('modeIcon');
        const modeTitle = document.getElementById('modeTitle');
        const modeDescription = document.getElementById('modeDescription');

        let currentMode = 'checking';
        let emailCheckTimeout;
        let lastCheckedEmail = '';
        let isCheckingEmail = false;

        // التحقق من صحة البريد الإلكتروني
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        // عرض رسالة
        function showMessage(text, type = 'info') {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.classList.remove('hidden');
            
            if (type !== 'error') {
                setTimeout(() => {
                    if (messageDiv.className.includes(type)) {
                        messageDiv.classList.add('hidden');
                    }
                }, 4000);
            }
        }

        // إخفاء الرسالة
        function hideMessage() {
            messageDiv.classList.add('hidden');
        }

        // تحديث واجهة المستخدم حسب الوضع
        function updateUIMode(mode, email = '') {
            currentMode = mode;
            
            switch(mode) {
                case 'register':
                    nameGroup.classList.remove('hidden');
                    modeInfo.classList.remove('hidden');
                    modeIcon.className = 'fas fa-user-plus';
                    modeTitle.textContent = 'تسجيل حساب جديد';
                    modeDescription.innerHTML = `مرحبًا! <strong>${email}</strong> جديد على Nova Pass. أدخل اسمك لتكملة التسجيل.`;
                    btnText.textContent = 'إنشاء حساب';
                    break;
                    
                case 'login':
                    nameGroup.classList.add('hidden');
                    modeInfo.classList.remove('hidden');
                    modeIcon.className = 'fas fa-sign-in-alt';
                    modeTitle.textContent = 'تسجيل الدخول';
                    modeDescription.innerHTML = `مرحبًا مرة أخرى! <strong>${email}</strong> لديه حساب على Nova Pass. أدخل كلمة المرور.`;
                    btnText.textContent = 'تسجيل الدخول';
                    break;
                    
                case 'checking':
                default:
                    nameGroup.classList.add('hidden');
                    modeInfo.classList.add('hidden');
                    btnText.textContent = 'التحقق من البريد الإلكتروني';
                    break;
            }
        }

        // 🔥 الدالة المُحسنة للتحقق من البريد الإلكتروني (بدون fetchSignInMethodsForEmail)
        async function checkEmailAvailability(email) {
            if (isCheckingEmail) return;
            
            try {
                isCheckingEmail = true;
                console.log('🔍 جاري التحقق من البريد:', email);
                
                // ✅ الطريقة الجديدة: محاولة fetchSignInMethods مع fallback آمن
                let methods = [];
                let hasAccount = false;
                
                try {
                    methods = await fetchSignInMethodsForEmail(auth, email);
                    hasAccount = methods && methods.length > 0;
                    console.log('✅ نتيجة التحقق (fetchSignInMethods):', hasAccount ? 'موجود' : 'جديد');
                } catch (fetchError) {
                    // 🔥 في حالة الخطأ، نجرب طريقة بديلة: محاولة تسجيل دخول وهمي
                    console.warn('⚠️ fetchSignInMethods فشلت، نجرب طريقة بديلة:', fetchError.message);
                    
                    // الطريقة البديلة: نحاول نبحث في Firestore
                    try {
                        // البحث عن المستخدم في Firestore باستخدام البريد الإلكتروني
                        const usersRef = collection(db, 'users');
                        const q = query(usersRef, where('email', '==', email));
                        const querySnapshot = await getDocs(q);
                        hasAccount = !querySnapshot.empty;
                        console.log('✅ نتيجة التحقق (Firestore):', hasAccount ? 'موجود' : 'جديد');
                    } catch (dbError) {
                        console.warn('⚠️ فشل البحث في Firestore:', dbError.message);
                        // في أسوأ الحالات، نعتبر الحساب غير موجود ونسجل جديد
                        hasAccount = false;
                    }
                }
                
                if (hasAccount) {
                    // البريد الإلكتروني موجود بالفعل - تسجيل دخول
                    console.log('✅ البريد موجود، تحويل إلى تسجيل الدخول');
                    emailInput.classList.remove('error');
                    emailInput.classList.add('success');
                    updateUIMode('login', email);
                    showMessage('✓ هذا البريد مسجل مسبقاً، يمكنك تسجيل الدخول', 'success');
                } else {
                    // البريد الإلكتروني جديد - تسجيل حساب
                    console.log('🆕 البريد جديد، تحويل إلى تسجيل جديد');
                    emailInput.classList.remove('error');
                    emailInput.classList.add('success');
                    updateUIMode('register', email);
                    showMessage('✓ بريد إلكتروني جديد، يمكنك إنشاء حساب', 'success');
                }
                
                lastCheckedEmail = email;
                hideMessage();
                
            } catch (error) {
                console.error('❌ خطأ في التحقق:', error.code, error.message);
                emailInput.classList.remove('success');
                emailInput.classList.add('error');
                
                if (error.code === 'auth/invalid-email') {
                    showMessage('❌ بريد إلكتروني غير صحيح', 'error');
                } else if (error.code === 'auth/too-many-requests') {
                    showMessage('❌ محاولات كثيرة جداً. حاول مرة أخرى لاحقاً', 'error');
                } else {
                    showMessage('❌ حدث خطأ أثناء التحقق. حاول مرة أخرى', 'error');
                }
                
                updateUIMode('checking');
            } finally {
                isCheckingEmail = false;
                submitBtn.disabled = false;
            }
        }

        // تبديل إظهار/إخفاء كلمة المرور
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
        });

        // الاستماع لإدخال البريد الإلكتروني
        emailInput.addEventListener('input', (e) => {
            const email = e.target.value.trim();
            
            // إلغاء الـ timeout السابق
            if (emailCheckTimeout) {
                clearTimeout(emailCheckTimeout);
            }
            
            // إذا كان البريد فارغ
            if (!email) {
                updateUIMode('checking');
                hideMessage();
                emailInput.classList.remove('success', 'error');
                submitBtn.disabled = false;
                lastCheckedEmail = '';
                return;
            }
            
            // التحقق من صحة البريد الإلكتروني
            if (!isValidEmail(email)) {
                showMessage('⚠️ يرجى إدخال بريد إلكتروني صحيح (مثال: name@domain.com)', 'error');
                emailInput.classList.add('error');
                emailInput.classList.remove('success');
                updateUIMode('checking');
                submitBtn.disabled = true;
                return;
            }
            
            // إذا كان نفس البريد الذي تم التحقق منه مسبقًا، لا تتحقق مرة أخرى
            if (email === lastCheckedEmail && currentMode !== 'checking') {
                emailInput.classList.remove('error');
                emailInput.classList.add('success');
                submitBtn.disabled = false;
                hideMessage();
                return;
            }
            
            // عرض رسالة التحقق
            showMessage('⏳ جاري التحقق من البريد الإلكتروني...', 'info');
            emailInput.classList.remove('error', 'success');
            submitBtn.disabled = true;
            
            // تعيين timeout للتحقق
            emailCheckTimeout = setTimeout(async () => {
                await checkEmailAvailability(email);
            }, 800);
        });

        // إرسال النموذج
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const name = nameInput.value.trim();
            
            // التحقق من صحة البريد
            if (!isValidEmail(email)) {
                showMessage('⚠️ يرجى إدخال بريد إلكتروني صحيح', 'error');
                emailInput.focus();
                return;
            }
            
            // التحقق من كلمة المرور
            if (!password) {
                showMessage('⚠️ يرجى إدخال كلمة المرور', 'error');
                passwordInput.focus();
                return;
            }
            
            if (password.length < 6) {
                showMessage('⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error');
                passwordInput.focus();
                return;
            }
            
            // التحقق من الاسم في حالة التسجيل
            if (currentMode === 'register' && !name) {
                showMessage('⚠️ يرجى إدخال الاسم الكامل', 'error');
                nameInput.focus();
                return;
            }
            
            // تعطيل الزر أثناء المعالجة
            submitBtn.disabled = true;
            const originalText = btnText.textContent;
            btnText.innerHTML = '<div class="loading"></div>';
            
            try {
                if (currentMode === 'register') {
                    console.log('🚀 جاري إنشاء حساب جديد:', email);
                    
                    // إنشاء حساب في Firebase Authentication
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;
                    
                    // إنشاء مستند في Firestore
                    await setDoc(doc(db, "users", user.uid), {
                        name: name,
                        email: email,
                        createdAt: serverTimestamp(),
                        updatedAt: serverTimestamp(),
                        lastLogin: serverTimestamp(),
                        emailVerified: user.emailVerified
                    });
                    
                    showMessage('🎉 تم إنشاء الحساب بنجاح! جاري التوجيه...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 2000);
                    
                } else if (currentMode === 'login') {
                    console.log('🔑 جاري تسجيل الدخول:', email);
                    
                    // تسجيل الدخول
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;
                    
                    // تحديث وقت آخر دخول
                    const userDocRef = doc(db, "users", user.uid);
                    const userDoc = await getDoc(userDocRef);
                    
                    if (userDoc.exists()) {
                        await setDoc(userDocRef, {
                            lastLogin: serverTimestamp()
                        }, { merge: true });
                    } else {
                        // إذا لم يكن هناك مستند، نقوم بإنشائه
                        await setDoc(userDocRef, {
                            email: email,
                            lastLogin: serverTimestamp(),
                            updatedAt: serverTimestamp()
                        }, { merge: true });
                    }
                    
                    showMessage('✅ تم تسجيل الدخول بنجاح! جاري التوجيه...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1500);
                }
                
            } catch (error) {
                console.error('❌ خطأ في المصادقة:', error.code, error.message);
                
                // إعادة تمكين الزر
                submitBtn.disabled = false;
                btnText.textContent = originalText;
                
                let errorMessage = '❌ حدث خطأ غير متوقع. حاول مرة أخرى';
                
                switch(error.code) {
                    case 'auth/email-already-in-use':
                        errorMessage = '❌ هذا البريد الإلكتروني مستخدم بالفعل. يرجى تسجيل الدخول';
                        updateUIMode('login', email);
                        break;
                    case 'auth/user-not-found':
                        errorMessage = '❌ لا يوجد حساب بهذا البريد الإلكتروني. يرجى التسجيل';
                        updateUIMode('register', email);
                        break;
                    case 'auth/wrong-password':
                        errorMessage = '❌ كلمة المرور غير صحيحة. حاول مرة أخرى';
                        passwordInput.focus();
                        break;
                    case 'auth/weak-password':
                        errorMessage = '❌ كلمة المرور ضعيفة. استخدم 6 أحرف على الأقل';
                        break;
                    case 'auth/too-many-requests':
                        errorMessage = '❌ تم إجراء محاولات كثيرة. حاول مرة أخرى لاحقاً';
                        break;
                    case 'auth/network-request-failed':
                        errorMessage = '❌ خطأ في الاتصال بالإنترنت. تأكد من اتصالك';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = '❌ بريد إلكتروني غير صحيح';
                        break;
                    case 'auth/invalid-credential':
                        errorMessage = '❌ بيانات الدخول غير صحيحة';
                        break;
                }
                
                showMessage(errorMessage, 'error');
                
                // تنظيف حقل كلمة المرور في حالة الخطأ
                if (error.code === 'auth/wrong-password') {
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            }
        });

        // تهيئة الواجهة
        updateUIMode('checking');
        
        // التحقق إذا كان المستخدم مسجل الدخول بالفعل
        onAuthStateChanged(auth, (user) => {
            if (user && window.location.pathname.includes('auth.html')) {
                console.log('👤 مستخدم مسجل دخول بالفعل، جاري التوجيه...');
                window.location.href = "index.html";
            }
        });

        // التركيز على حقل البريد الإلكتروني تلقائيًا
        setTimeout(() => {
            emailInput.focus();
        }, 100);
    </script>
</body>
</html>
